name: Hello world
# on: ["push","pull_request"]
on: 
  push:
    branches:
      - main, deploy, 'release/*'
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build step
        run: echo "A demo build"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test phase
        run: echo "Running test cases"

  deploy:
      runs-on: ubuntu-latest
      needs: test
      steps:
        - name: Deploy the app
          run: echo "Deploying the app"
    
  
